# Link checker config for `lychee`, run against the built `dist/` output in CI.
# https://lychee.cli.rs/usage/config/

no_progress = true

# Same-origin links are absolute (canonical/OG/sitemap all use the production
# domain), but this runs against the just-built dist/ *before* it's deployed —
# checking agustinmusanti.github.io over the network would 404 on every run
# until the first successful deploy, and stay a flaky external dependency after
# that. Remap them to the local build output instead; only genuinely external
# domains hit the network.
remap = ["https://agustinmusanti.github.io file://./dist"]

exclude = [
  # Local dashboards/demos may be slow or blocked by anonymous crawlers.
  "^https://app\\.powerbi\\.com",
]

# mailto: links aren't fetchable, just structurally valid.
scheme = ["https", "http"]

timeout = 20
retry_wait_time = 2
max_retries = 3

accept = [200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308]
