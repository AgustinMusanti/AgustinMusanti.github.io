# Link checker config for `lychee`, run against the built `dist/` output in CI.
# https://lychee.cli.rs/usage/config/

base = "dist"
no_progress = true

# Static files only; the built HTML is what ships.
include = ["dist/**/*.html"]

exclude = [
  # Local dashboards/demos may be slow or blocked by anonymous crawlers.
  "^https://app\\.powerbi\\.com",
]

# mailto: links aren't fetchable, just structurally valid.
scheme = ["https", "http"]

timeout = 20
retry_wait_time = 2
max_retries = 3

accept = [200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308]
